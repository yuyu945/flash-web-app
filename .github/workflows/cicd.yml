name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pytest tests/ -v

      - name: Deploy to Touge Server via SSH
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
          TOUGE_SSH_PORT: 50241
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          printf "%s\n" "$TOUGE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -p "$TOUGE_SSH_PORT" -H "$TOUGE_SERVER_IP" >> "$HOME/.ssh/known_hosts"

          ssh -p "$TOUGE_SSH_PORT" \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            "root@$TOUGE_SERVER_IP" << 'EOF'
          set -e
          cd /root/flask-web-app
          git pull origin main
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          supervisorctl restart flask-web-app
          supervisorctl status flask-web-app
          EOF